<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icônes dérivées de /logo-vita-now.png. Trois formats, et chacun sert :

      · favicon.ico — 16/32/48 en un fichier. Certains agrégateurs et lecteurs
        de flux le cherchent à la racine sans jamais lire ce HTML ; sans lui,
        ils affichent une page blanche à la place de l'icône.
      · Les PNG 16 et 32 — ce que les navigateurs modernes préfèrent, et ce qui
        évite le rééchantillonnage flou d'une grande image réduite à la volée.
      · apple-touch-icon 180 — l'icône d'un raccourci ajouté à l'écran d'accueil
        sur iOS. Sans elle, Safari fabrique une vignette de la page.

      Le logo d'origine fait 847×711 : il a été rogné puis recentré dans un
      carré avant redimensionnement, sinon le navigateur l'écrase sur un axe.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="VITA'NOW aide les étudiants à démarrer, suivre, reprendre et terminer leurs projets — et à retrouver ce qui a déjà été compris avant de recommencer seul."
    />
    <meta property="og:title" content="VITA'NOW — Termine ce que tu commences." />
    <meta
      property="og:description"
      content="Le compagnon de projets étudiants : mémoire de projet, reprise guidée, communauté."
    />
    <meta property="og:type" content="website" />
    <title>VITA'NOW — Termine ce que tu commences.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
