# VITA'NOW / Aura++ — portail d'administration isolé.
#
# À installer dans /etc/nginx/sites-available/manage.aura-plus.site puis à
# lier dans sites-enabled. Le certificat est créé avant activation du bloc
# HTTPS : voir deploy/EXPLOITATION.md.

server {
    listen 80;
    listen [::]:80;
    server_name manage.aura-plus.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name manage.aura-plus.site;

    root /var/www/aura-plus-plus;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/manage.aura-plus.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.aura-plus.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
