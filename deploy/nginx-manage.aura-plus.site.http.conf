# Étape d'amorçage unique : sert le challenge ACME avant le certificat.
server {
    listen 80;
    listen [::]:80;
    server_name manage.aura-plus.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
