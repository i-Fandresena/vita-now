# VITA'NOW — vhost nginx
#
# À déposer dans /etc/nginx/sites-available/aura.icpp-conformite.cloud
# puis lier dans sites-enabled/.
#
# Les blocs TLS sont ceux que Certbot écrit. Si le vhost existe déjà avec un
# certificat, NE PAS l'écraser : n'y reporter que le bloc `location /api/`
# et l'en-tête de sécurité. Réécrire le fichier ferait perdre les directives
# de Certbot, et le renouvellement automatique cesserait.

server {
    listen 80;
    listen [::]:80;
    server_name aura.icpp-conformite.cloud;

    # Laisser passer le renouvellement du certificat avant toute redirection.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aura.icpp-conformite.cloud;

    ssl_certificate     /etc/letsencrypt/live/aura.icpp-conformite.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aura.icpp-conformite.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vitanow;
    index index.html;

    # ── En-têtes ─────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # `SAMEORIGIN` et non `DENY` : le produit peut légitimement être montré
    # en iframe depuis une page de l'école pendant une soutenance.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La contrainte produit est une réponse en moins de 2 s. Un délai
        # d'attente de 60 s laisserait une requête bloquée occuper une
        # connexion bien après que l'utilisateur ait renoncé.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Réponses d'API jamais mises en cache par un intermédiaire : elles
        # dépendent de la session.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # ── Front (SPA statique) ─────────────────────────────────────────────
    # Les fichiers d'`/assets/` portent une empreinte dans leur nom : leur
    # contenu ne change jamais à URL constante, on peut donc les figer un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html` n'est jamais mis en cache : c'est lui qui référence les
    # empreintes des assets. Mis en cache, un navigateur continuerait de
    # demander des fichiers supprimés au déploiement suivant — écran blanc.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Le routage est en #hash : toute URL retombe donc sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/vitanow.access.log;
    error_log  /var/log/nginx/vitanow.error.log;
}
